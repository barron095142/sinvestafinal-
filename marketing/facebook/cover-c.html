.cta{position:absolute;left:890px;top:418px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.pill{background:var(--navy);color:#fff;font-family:"DM Sans";font-weight:700;font-size:23px;padding:12px 24px;border-radius:999px}
.pill span{color:var(--amber);font-weight:600;font-size:15px;margin-right:10px}
