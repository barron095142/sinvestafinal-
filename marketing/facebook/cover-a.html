<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:var(--navy);position:relative}
.photo{position:absolute;left:0;top:0;width:1100px;height:624px;background:url("../../SINVESTA MODERN FINAL WEB/assets/img/roof-tile-dark-sydney.jpg") center/cover}
.fade{position:absolute;inset:0;background:
 linear-gradient(90deg,rgba(10,22,38,0) 0px,rgba(10,22,38,.15) 420px,rgba(10,22,38,.82) 700px,#0A1626 900px),
 linear-gradient(0deg,rgba(10,22,38,.55),rgba(10,22,38,0) 40%)}
.glow{position:absolute;right:-180px;top:-260px;width:760px;height:760px;border-radius:50%;
 background:radial-gradient(circle,rgba(232,163,23,.22),rgba(232,163,23,0) 62%)}
.rays{position:absolute;right:0;top:0;width:420px;height:624px;opacity:.10;
 background:repeating-linear-gradient(115deg,#fff 0 2px,transparent 2px 46px)}
.txt{position:absolute;left:740px;top:46px;width:640px;color:#fff}
.chip{display:inline-flex;align-items:center;background:#fff;border-radius:12px;padding:10px 16px;margin-bottom:24px}
.chip img{height:44px;display:block}
.eyebrow{font-family:"DM Sans";font-weight:600;letter-spacing:.18em;font-size:15px;color:var(--amber);margin-bottom:14px}
h1{font-family:"DM Sans";font-weight:700;font-size:48px;line-height:1.03;white-space:nowrap;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--amber)}
.bar{width:84px;height:4px;background:var(--lime);border-radius:2px;margin:18px 0 18px}
.stats{display:flex;gap:30px;font-size:15px;color:#C9D6E8}
.stats b{display:block;font-family:"DM Sans";font-weight:700;font-size:28px;color:#fff;letter-spacing:-.01em}
.cta{position:absolute;left:740px;top:392px;display:flex;align-items:center;gap:22px}
.pill{background:var(--amber);color:var(--navy);font-family:"DM Sans";font-weight:700;font-size:24px;padding:12px 24px;border-radius:999px}
.pill span{font-weight:500;font-size:16px;margin-right:10px;opacity:.85}
.web{color:#fff;font-family:"DM Sans";font-weight:600;font-size:20px}
.web small{display:block;color:#8FA3BF;font-family:Switzer;font-weight:500;font-size:14px}
</style></head><body>
<div class="photo"></div><div class="fade"></div><div class="glow"></div><div class="rays"></div>

 <div class="bar"></div>

 </div>
</div>
